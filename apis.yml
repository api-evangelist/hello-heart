aid: hello-heart
name: Hello Heart
description: >-
  Hello Heart is a digital health company that combines a mobile app, connected
  blood-pressure monitors, a smart pill box, and the Nia AI assistant (trained
  on ACC/AHA guidelines) to help people proactively manage cardiovascular
  health. Sold primarily to employers, health plans, unions, and public-sector
  benefits programs as a covered heart-health benefit, the platform pairs
  self-monitoring with clinically-grounded, "safe AI" coaching to lower blood
  pressure and reduce cardiac risk. Hello Heart is HITRUST CSF certified, SOC 2
  Type 2 audited, NIST CSF aligned, and HIPAA compliant, with data encrypted in
  transit and at rest and stored within U.S. borders. It exposes no public
  developer API; this profile captures the company's public identity, security,
  and compliance posture.
